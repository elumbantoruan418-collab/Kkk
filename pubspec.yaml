name: Build Android APK

on:
  push:
    branches:
      - main
      - utama
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create Dummy Android Folder
        run: |
          mkdir -p android/app/src/main
          curl -L -o android/build.gradle https://raw.githubusercontent.com/flutter/flutter/main/packages/flutter_tools/templates/app_shared/android.tmpl/build.gradle
          curl -L -o android/app/build.gradle https://raw.githubusercontent.com/flutter/flutter/main/packages/flutter_tools/templates/app_shared/android.tmpl/app/build.gradle
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"></manifest>' > android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

